syntax = "proto3";
package psi;

// ------------------------------------------------------------
// Ping（疎通確認）
// ------------------------------------------------------------
message PingReq {
  string msg = 1;
}

message PingResp {
  string msg = 1;
}

// ------------------------------------------------------------
// ECC-PSI: Phase 1 (鍵交換)
// ------------------------------------------------------------
message KeyExchangeReq {
  // Client → Server : 暗号化鍵セット (b * Q)
  repeated bytes enc_keys = 1;
}

message KeyExchangeResp {
  // Server → Client : サーバ側暗号化鍵 (a * P)
  repeated bytes server_enc_keys = 1;

  // Server → Client : サーバが再暗号化した client 鍵 (a * b * Q)
  repeated bytes client_reenc_keys = 2;
}

// ------------------------------------------------------------
// ECC-PSI: Phase 2 (サーバ側も共通集合を復元するためのデータ送信)
// ------------------------------------------------------------
message ClientFinalReq {
  // Client → Server : クライアントが再暗号化したサーバ鍵 (a * b * P)
  repeated bytes client_reenc_server_keys = 1;
}

message ServerPsiResult {
  // Server が計算した共通集合（サーバ視点）
  repeated bytes common_keys = 1;
}

// ------------------------------------------------------------
// PSI Service
// ------------------------------------------------------------
service PsiService {
  // 疎通確認
  rpc Ping (PingReq) returns (PingResp);

  // Phase 1: 鍵交換（暗号化セット交換）
  rpc ExchangeKeys (KeyExchangeReq) returns (KeyExchangeResp);

  // Phase 2: クライアントがサーバにも abP を送る（双方向 PSI 完成）
  rpc FinalizePsi (ClientFinalReq) returns (ServerPsiResult);
}
