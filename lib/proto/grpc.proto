syntax = "proto3";
package grpc;

// Phase 1
message KeyExchangeReq {
  repeated bytes enc_keys = 1;
}

message KeyExchangeResp {
  repeated bytes server_enc_keys = 1;
  repeated bytes client_reenc_keys = 2;
}

// Phase 2
message ClientFinalReq {
  repeated bytes client_reenc_server_keys = 1;
}

// サーバが返すものは何も不要
message PsiDone {}

service GrpcService {
  rpc ExchangeKeys (KeyExchangeReq) returns (KeyExchangeResp);
  rpc FinalizePsi (ClientFinalReq) returns (PsiDone);
}
